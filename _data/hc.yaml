      url: "/themes/"
    button2: 
      text: "Services"
      url: "/services/"
  section2: 
    mono: "Trusted Theme Shop - High-Conversion SEO Article - Fully Online"
    title: "Ownership, not rental."
    description: "Why founders choose a one-time theme over monthly builders"
    text: 
      - info: "Monthly builders charge recurring fees for speed and hosting you don't fully control."
      - info: "Updates can break customizations. Plugins add weight over time."
      - info: "With recurring payments, you build equity in their platform, not your own codebase and content structure."
      - info: "Our themes are built for founders who need a stable base to rank and maintain. Pure HTML, CSS, JS - no database, no complex build step required to run."
      - info: "Performance budget kept small by design. Online delivery, documentation included, launch in hours not weeks."
    get_title: "What you get - deliverables:"
    get_list: 
      - text: "Full source included - theme files, docs, deployment guide, no lock-in, delivery via Gumroad."
      - text: "SEO structure included - meta tags, Open Graph, Twitter Card, schema, canonical, sitemap, robots, heading hierarchy."
      - text: "Optimized assets - WebP images, system fonts, lite YouTube embed option where applicable."
      - text: "Documentation for setup and updates - clear guide for hosting on any static host."
    info_label: "Launch path:"
    info: "Path: Choose theme - instant delivery - launch with docs - maintain long-term. Custom support available via Fiverr if needed."
    badge: 
      - button: "SEO Ready"
      - button: "Lighthouse 90+"
      - button: "One-Time"
      - button: "Multi Stack"
  copyrigths: "2026 HockeyComputindo - Multi Stack Themes"
