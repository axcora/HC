services:
  title: "Custom Web Architecture"
  description: "Headless commerce, booking systems, static site generators, and AI automation — engineered for speed, SEO, and full ownership. No subscriptions, no lock-in."
  info: "Commerce, booking, SSG, AI — built to own, not rent."
  list:
    - title: "Rank-Ready Premium Website — Forensic SEO, 100 PageSpeed"
      info: "Web Presence"
      description: "Your competitors rank, you don't. Get a premium website with forensic SEO architecture — semantic HTML, canonical tags, Open Graph, JSON-LD, sitemap — crafted to rank and convert. 100 PageSpeed score from day one. No monthly fees, no rented platform."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/create-your-custom-website-and-app"
    - title: "Free-Hosting JAMstack Migration — Jekyll, Astro, 11ty"
      info: "Static Site Generator"
      description: "Still paying monthly for a static website? Migrate from WordPress to high-performance JAMstack — 90+ PageSpeed, $0 hosting bill, content stays in your Git repo. Fast, secure, and fully yours."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/design-your-modern-website-using-jekyll"
    - title: "Lightweight Flat-File CMS — No WordPress Bloat"
      info: "Web Presence"
      description: "WordPress slow and vulnerable? Get a custom flat-file CMS with MySQL or SQLite — fast, secure, and 100% yours. No plugin updates, no security patches, no bloat. Just performance."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/design-a-website-blog-with-our-cool-template-flat-file-cms"
    - title: "Headless Next.js & Gatsby — 90+ Lighthouse, Edge-Ready"
      info: "Headless Architecture"
      description: "Need scale and speed? Headless Next.js and Gatsby builds with 90+ Lighthouse scores, edge-ready deployment, and 100% source ownership. No lock-in, no performance ceiling, built to own."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/create-your-website-with-new-technology"
    - title: "Documentation OS — Docusaurus, Starlight, Nextra"
      info: "Web Presence"
      description: "Docs broken, slow, unsearchable? Build a documentation OS with Docusaurus, Starlight, or Nextra — a sovereign knowledge base that scales with you and stays searchable forever."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/design-modern-documentation-website-astro-js-stalight"
    - title: "Zero-Oversell Commerce — FoxyCart + Supabase POS"
      info: "Headless Architecture"
      description: "Overselling kills trust. Unified POS and online shop with FoxyCart checkout and Supabase backend — guaranteed zero oversell, enterprise inventory without the bloat."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/design-modern-headless-online-shop-ecommerce-website"
    - title: "Payment-Freedom Booking System — Decoupled Automation"
      info: "Headless Architecture"
      description: "Payment provider locking your booking flow? Decouple it. Own your flow, not rent it — separated logic, provider-agnostic, automation-first, zero commission."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/create-your-website-with-cms"
    - title: "Forensic Self-Hosted AI — Vision, Finance, Autoblog"
      info: "AI Automation"
      description: "Stop giving your data to the cloud. SAEDI Vision runs on your own infrastructure — forensic audit trail, vision intelligence, finance automation, 100% auditable. Own your pipeline and your data."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/ai-automation-finance-vision-saedi-autoblog-own-100"
    - title: "Python-First SSG — No Ruby, No Node Headache"
      info: "Static Site Generator"
      description: "Sick of gem and npm conflicts? Pycora is Python-native — own your pipeline, no dependency hell, no Jekyll, no Astro. Just a clean Python build."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/design-your-website-with-phyton-django"
    - title: "Git-Based CMS Bridge — Decap, Sveltia, Tina"
      info: "Headless Architecture"
      description: "Decap, Sveltia, Tina. You own the content, the repo, and the workflow. Visual editing on top of Git source truth — no database, no lock-in."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/convert-your-figma-and-ui-design-to-flatfile-cms-or-ssg"
    - title: "Own 100% .NET Engine — 12ms Build, No Lock-In"
      info: "Static Site Generator"
      description: "Slow builds and rented platforms? DAX .NET 8 static builder — 12ms compile, zero bloat, single binary, immutable infrastructure you control forever. Own the source, not the subscription."
      button:
        text: "Order Now"
        url: "https://www.fiverr.com/creativitas/design-your-website-with-progresive-web-application"

footer:
  section1: 
    title: "STOP RENTING."
    description: "Own Your Site."
    text: "Most theme shops charge monthly to rent speed and SEO. We provide ownership - one time, yours forever."
    list: 
      - info: "Search-ready from day one. Semantic HTML, canonical tags, Open Graph, Twitter Card, JSON-LD, sitemap - included as standard structure."
      - info: "Clean codebase - HTML, CSS, JS. One CSS file, one JS file. No heavy dependencies."
      - info: "Performance focused - 90+ Lighthouse baseline, small payload, system fonts, WebP and optimized images where applicable."
      - info: "Content ownership - your repository, your content. Markdown and YAML frontmatter, no database lock-in."
      - info: "Easy deployment - works with Vercel, Cloudflare Pages, Netlify, or any static host. Deploy guide included."
      - info: "Documentation included - setup, customization, and hosting guide. No extra course needed to launch."
      - info: "Instant delivery. No physical store, no chat sales. Choose, download, launch."
      - info: "Lifetime use. One purchase for ongoing use. Support available via Fiverr escrow if needed, not forced."
    button: 
