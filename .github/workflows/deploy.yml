name: Deploy CAX SSG to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCC
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build CAX SSG
        run: |
          make clean || true
          make linux
          chmod +x ./cax
          ls -lh ./cax

      - name: Build Site
        run: ./cax build

      - name: Build Chat Index
        run: |
          gcc -O2 -std=c11 -o cax-chat-index src/chat/chat_json.c src/chat/chat_main.c
          ./cax-chat-index content/themes site/themes-index.json
          ls -lh site/themes-index.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4